        /* Estilos gerais e de componentes */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }

        .employee-card {
            /* Define a transição base para todas as alterações */
            transition: all 0.2s ease-in-out;
        }

        /* 1. ESTILO DE HOVER (Azul e Negrito) */
        .employee-card:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2), 0 4px 6px -2px rgba(0, 0, 0, 0.1);
            /* Sombra mais forte */
            transform: translateY(-2px);
            background-color: #bfdbfe;
            /* Tailwind blue-200 (Azul Claro) */
            font-weight: 700;
            /* Negrito */
        }

        /* 2. ESTILO PARA FUNCIONÁRIOS DESLIGADOS (Vermelho e Negrito) */
        .employee-card.terminated {
            color: #991b1b;
            /* Tailwind red-700 (Vermelho Escuro) */
            font-weight: 700;
            /* Negrito */
            background-color: #fee2e2;
            text-decoration: line-through;
            opacity: 0.8;
            /* Aumentei a opacidade para o texto negrito ficar mais visível */
        }

        /* Efeito de HOVER específico para cartões desligados (mantém o vermelho) */
        .employee-card.terminated:hover {
            background-color: #fca5a5;
            /* Tailwind red-300 */
            opacity: 1.0;
            /* Remove a opacidade no hover para destacar a interação */
            text-decoration: line-through;
            /* Mantém o risco */
            color: #7f1d1d;
            /* Vermelho ainda mais escuro no hover */
        }

        /* Estilo para líderes prioritários */
        .employee-card.leader-priority {
            background-color: #fef3c7;
            /* Amarelo claro */
            border: 2px solid #fbbf24;
            /* Amarelo */
            font-weight: 700;
        }

        /* Efeito de HOVER específico para cartões de líderes (aplica o azul e negrito por cima do amarelo) */
        .employee-card.leader-priority:hover {
            background-color: #bfdbfe;
            /* Aplica o Azul Claro do Hover */
            border-color: #60a5fa;
            /* Borda azul clara */
            color: #1f2937;
            /* Cor do texto padrão (escuro) no hover */
            font-weight: 800;
            /* Um pouco mais negrito */
        }

        .sub-nav-tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
            border-bottom: 2px solid #e2e8f0;
        }

        .sub-nav-tabs button {
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            color: #64748b;
            border-bottom: 2px solid transparent;
            transition: all 0.2s ease-in-out;
            background-color: transparent;
            border-radius: 0.5rem 0.5rem 0 0;
            margin: 0 0.25rem;
        }

        .sub-nav-tabs button.active {
            color: #1e3a8a;
            /* Azul mais escuro */
            border-bottom-color: #1e3a8a;
            background-color: #ffffff;
        }

        .sub-nav-tabs button:hover:not(.active) {
            color: #2563eb;
            background-color: #eff6ff;
        }

        .sector-card {
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            border-top: 4px solid #2563eb;
            /* Destaque azul */
            border-radius: 0.75rem;
            padding: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        }

        .sector-card.leader {
            border-top-color: #c2410c;
            /* Destaque laranja para líderes */
        }

        .sector-card h4 {
            font-weight: 700;
            color: #111827;
            text-align: center;
            margin-bottom: 0.75rem;
            font-size: 1.125rem;
        }

        /* --- Estilos de Impressão --- */
        @media print {

            body {
                background: #fff !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            nav,
            #modal-backdrop,
            #confirm-modal-backdrop,
            #message-container,
            .no-print {
                display: none !important;
            }

            .print-header {
                display: block !important;
                text-align: center;
                margin-bottom: 2rem;
            }

            .print-logo {
                width: 200px;
                height: auto;
                margin: 0 auto 1rem;
            }

            #print-footer {
                display: block !important;
                position: fixed;
                bottom: 0;
                left: 0;
                width: 100%;
                text-align: center;
                padding: 10px 0;
                font-size: 9pt;
                color: #666;
                border-top: 1px solid #ccc;
            }

            main {

            }

            .printable-area {
                box-shadow: none !important;

                border: none !important;

            .print-title {

            .org-chart-column {

                background-color: #1e3a8a !important;

            }

            .shift-header h3 {

            .shift-header p {

            .sector-card {

            const getAllEmployeesFromShift = (shift) => Object.values(shift.functions || {}).flat();
            const getAllEmployeesFromFactory = (factory) => {
                if (!factory) return [];
                if (factory.shifts) return factory.shifts.flatMap(getAllEmployeesFromShift);
                if (factory.sectors) return Object.values(factory.sectors).flat();
                return [];
            };
            const getSectorsForFactory = (factoryId) => {
                const factory = factories[factoryId];
                if (!factory) return [];
                const sectors = new Set();
                if (factory.shifts) factory.shifts.forEach(shift => Object.keys(shift.functions || {}).forEach(func => sectors.add(func)));
                else if (factory.sectors) Object.keys(factory.sectors || {}).forEach(sector => sectors.add(sector));
                return Array.from(sectors).sort();
            };

            const filterEmployees = (employees) => {
                if (!searchTerm || currentView !== 'organograma') return employees;
                const term = searchTerm.toUpperCase();
                return employees.filter(emp => emp.name?.toUpperCase().includes(term));
            };

            const sortEmployeesByHierarchy = (employees, responsibleName = null) => {
                const upperResponsible = responsibleName ? responsibleName.toUpperCase().trim() : '';
                const upperPriorityLeaders = PRIORITY_LEADERS.map(name => name.toUpperCase().trim());

                return [...employees].sort((a, b) => {
                    const upperA = a.name ? a.name.toUpperCase().trim() : ''; // Proteção contra nome undefined/null
                    const upperB = b.name ? b.name.toUpperCase().trim() : ''; // Proteção contra nome undefined/null

                    // Se um nome for vazio e o outro não, o nome vazio vai para o final
                    if (upperA === '' && upperB !== '') return 1;
                    if (upperA !== '' && upperB === '') return -1;
                    if (upperA === '' && upperB === '') return 0;

                    const isAExplicitLeader = upperPriorityLeaders.includes(upperA);
                    const isBExplicitLeader = upperPriorityLeaders.includes(upperB);

                    const isAResponsible = upperA === upperResponsible;
                    const isBResponsible = upperB === upperResponsible;

                    // Priority 1: Check if A or B are leaders (explicit or responsible)
                    const isALeader = isAResponsible || isAExplicitLeader;
                    const isBLeader = isBResponsible || isBExplicitLeader;

                    // Se A for líder e B não for, A vem primeiro
                    if (isALeader && !isBLeader) return -1;
                    // Se B for líder e A não for, B vem primeiro
                    if (!isALeader && isBLeader) return 1;

                    // Se ambos são líderes, aplicamos a ordem definida no array PRIORITY_LEADERS
                    if (isAExplicitLeader && isBExplicitLeader) {
                        const indexA = upperPriorityLeaders.indexOf(upperA);
                        const indexB = upperPriorityLeaders.indexOf(upperB);
                        // Ordena pelo índice (BOMBADO - 0, XANDECO - 1, LUIS - 2)
                        return indexA - indexB;
                    }

                    // Desempate final (aplica-se se ambos são do mesmo tipo de liderança mista ou se nenhum é líder)
                    return upperA.localeCompare(upperB);
                });

                    showMessage('Alterações salvas localmente (Modo Offline).', 'info');
                } catch (e) {
                    console.error("Erro ao salvar no LocalStorage:", e);
                    showMessage('Falha ao salvar localmente. Espaço insuficiente?', 'error');
                }
            }
            
            /**
             * Carrega dados do LocalStorage.
             * @returns {boolean} True se os dados foram carregados localmente, caso contrário, false.
             */
            function loadDataFromLocal() {
                try {
                    const savedData = localStorage.getItem(LOCAL_STORAGE_KEY);
                    if (savedData) {
                        const parsedData = JSON.parse(savedData);
                        factories = parsedData.factories || initialFactoriesData;
                        hiringNeeds = parsedData.hiringNeeds || initialHiringNeedsData;
                        log = parsedData.log || initialLogData;
                        console.log("Dados carregados do LocalStorage.");
                        return true;
                    }
                } catch (e) {
                    console.error("Erro ao carregar do LocalStorage:", e);
                }
                return false;
            }

            /**
             * Salva o estado atual do aplicativo no Firestore (tentativa primária).
             * Usa LocalStorage como fallback em caso de falha.
             * @param {boolean} isSilent - Se deve suprimir mensagens de sucesso.
             */
            async function saveData(isSilent = false) {
                if (!isFirebaseActive || !auth?.currentUser || !ORG_DATA_REF) {
                    // Se o Firebase não estiver ativo ou autenticado, salva localmente e sai.
                    return saveDataLocal();
                }

                syncStatus.textContent = 'A sincronizar com Firestore...';
                syncStatus.style.backgroundColor = '#F39C12'; // Laranja
                syncStatus.style.color = '#FFFFFF';

                try {
                    await setDoc(ORG_DATA_REF, {
                        factories,
                        hiringNeeds,
                        log,
                        lastUpdated: new Date().toISOString(),
                    });

                    syncStatus.textContent = `Sincronizado às ${new Date().toLocaleTimeString('pt-BR')}`;
                    syncStatus.style.backgroundColor = '#2ECC71'; // Verde
                    syncStatus.style.color = '#FFFFFF';
                    if (!isSilent) showMessage('Alterações salvas e sincronizadas na nuvem.', 'success');
                } catch (error) {
                    console.error("Erro ao salvar no Firestore. Fallback para LocalStorage.", error);
                    // Em caso de falha na escrita, salva localmente.
                    saveDataLocal();
                    showMessage('Falha ao sincronizar com o Firestore. Salvo localmente.', 'error');
                }
            }

            /**
             * Inicializa o documento no Firestore com dados iniciais se não existir.
             */
            async function initializeFirstTimeData() {
                // Tenta carregar localmente primeiro
                if (loadDataFromLocal()) {
                    isAppReady = true;
                    updateUI();
                    return; // Sai se carregou do local
                }

                // Se não houver dados locais, usa dados iniciais e tenta salvar (Firebase ou Local)
                console.log("No local data found. Initializing with default data...");
                factories = JSON.parse(JSON.stringify(initialFactoriesData));
                hiringNeeds = JSON.parse(JSON.stringify(initialHiringNeedsData));
                log = JSON.parse(JSON.stringify(initialLogData));

                // Tenta salvar pela primeira vez (o que irá para o Firebase ou Local)
                await saveData(true); // Salva silenciosamente

                if (!isAppReady) {
                    isAppReady = true;
                    updateUI();
                }
                showMessage('Dados iniciais carregados.', 'success');
            }

            /**
             * Escuta alterações no Firestore em tempo real.
             */
            function setupRealtimeListener() {
                if (!isFirebaseActive || !ORG_DATA_REF) return;

                onSnapshot(ORG_DATA_REF, (docSnapshot) => {
                    const syncStatus = document.getElementById('syncStatus');

                    if (docSnapshot.exists()) {
                        const cloudData = docSnapshot.data();

                        // Simple check to see if the content data actually changed
                        const isContentDifferent =
                            JSON.stringify(cloudData.factories) !== JSON.stringify(factories) ||
                            JSON.stringify(cloudData.hiringNeeds) !== JSON.stringify(hiringNeeds) ||
                            JSON.stringify(cloudData.log) !== JSON.stringify(log);

                        if (isContentDifferent || !isAppReady) {
                            factories = cloudData.factories || {};
                            hiringNeeds = cloudData.hiringNeeds || [];
                            log = cloudData.log || [];

                            if (!isAppReady) {
                                isAppReady = true;
                                updateUI();
                                syncStatus.textContent = `Carregado (${new Date().toLocaleTimeString('pt-BR')})`;
                                syncStatus.style.backgroundColor = '#2ECC71';
                            } else if (isContentDifferent) {
                                updateUI();
                                showMessage('Atualização em tempo real recebida.', 'info');
                                syncStatus.textContent = `Sincronizado às ${new Date().toLocaleTimeString('pt-BR')}`;
                                syncStatus.style.backgroundColor = '#2ECC71';
                            }
                        }
                    } else {
                        // Documento não existe no Firebase (acesso pela primeira vez)
                        if (!isAppReady) {
                            initializeFirstTimeData();
                        } else {
                            console.warn("Documento Firestore não existe. Recriando...");
                            initializeFirstTimeData();
                        }
                    }
                    updateOnlineStatus();
                }, (error) => {
                    // ** AQUI O ERRO DE PERMISSÃO OCORRE **
                    console.error("Erro no listener do Firestore. Desativando Firebase.", error);
                    isFirebaseActive = false; // Desativa o Firebase no erro
                    syncStatus.textContent = 'Erro de Conexão: Modo Local';
                    syncStatus.style.backgroundColor = '#E74C3C';
                    
                    // Tratamento de erro específico para a UI.
                    if (error.message && error.message.includes('permission')) {
                        showMessage('Erro de Permissão: Falha ao conectar ao Firestore. Usando modo local.', 'error');
                    } else {
                        showMessage('Falha no Listener do Firestore. Usando modo local.', 'error');
                    }

                    // Tenta carregar ou inicializar localmente após a falha do listener
                    if (!isAppReady) {
                        initializeFirstTimeData();
                    } else {
                        saveDataLocal(); // Salva qualquer alteração recente no local
                    }
                });
            }

            function updateOnlineStatus() {
                const syncStatus = document.getElementById('syncStatus');
                if (!navigator.onLine) {
                    syncStatus.textContent = 'Offline (Aguardando rede)';
                    syncStatus.style.backgroundColor = '#5D6D7E';
                    syncStatus.style.color = '#FFFFFF';
                } else if (!isFirebaseActive) {
                    syncStatus.textContent = 'Modo Local (Firebase Desativado)';
                    syncStatus.style.backgroundColor = '#E74C3C';
                }
                // Se estiver online e ativo, o status do Firebase (verde ou laranja) prevalece.
            }

            function saveEditedEmployee() {
                const employeeId = document.getElementById('edit-employee-id').value, factoryId = document.getElementById('edit-employee-factory-id').value, contextId = document.getElementById('edit-employee-context-id').value, oldSectorName = document.getElementById('edit-employee-old-sector').value, newName = document.getElementById('edit-employee-name').value.toUpperCase().trim(), newSectorName = document.getElementById('edit-employee-sector').value.toUpperCase().trim();
                if (!newName || !newSectorName) return showMessage("Nome e setor são obrigatórios.", 'error');

                let employeeToMove;

                // 1. Remove o funcionário da posição antiga
                if (factoryId === 'pneus') {
                    const shift = factories.pneus.shifts.find(s => s.id === contextId);
                    if (shift?.functions?.[oldSectorName]) {
                        const employeeIndex = shift.functions[oldSectorName].findIndex(e => e.id === employeeId);
                        if (employeeIndex > -1) {
                            [employeeToMove] = shift.functions[oldSectorName].splice(employeeIndex, 1);
                        }
                        if (shift.functions[oldSectorName].length === 0) delete shift.functions[oldSectorName];
                    }
                } else {
                    if (factories[factoryId]?.sectors?.[oldSectorName]) {
                        const employeeIndex = factories[factoryId].sectors[oldSectorName].findIndex(e => e.id === employeeId);
                        if (employeeIndex > -1) {
                            [employeeToMove] = factories[factoryId].sectors[oldSectorName].splice(employeeIndex, 1);
                        }
                        if (factories[factoryId].sectors[oldSectorName].length === 0) delete factories[factoryId].sectors[oldSectorName];
                    }
                }

                if (!employeeToMove) return showMessage("Funcionário original não encontrado para mover.", "error");

                // 2. Atualiza nome e insere na nova posição
                employeeToMove.name = newName;
                if (factoryId === 'pneus') {
                    const shift = factories.pneus.shifts.find(s => s.id === contextId);
                    if (!shift.functions[newSectorName]) shift.functions[newSectorName] = [];
                    shift.functions[newSectorName].push(employeeToMove);
                } else {
                    if (!factories[factoryId].sectors[newSectorName]) factories[factoryId].sectors[newSectorName] = [];
                    factories[factoryId].sectors[newSectorName].push(employeeToMove);
                }

                hideModal();
                saveData();
            }
            function handleTerminateEmployee() {

                showConfirmModal('Desligar Funcionário', `Tem certeza que deseja marcar '${employeeName}' como desligado?`,
                    () => {
                        const employeeId = document.getElementById('edit-employee-id').value, factoryId = document.getElementById('edit-employee-factory-id').value, contextId = document.getElementById('edit-employee-context-id').value, oldSectorName = document.getElementById('edit-employee-old-sector').value;
                        let contextName = '', employee;

                        if (factoryId === 'pneus') {
                            const shift = factories.pneus.shifts.find(s => s.id === contextId);
                            employee = shift?.functions?.[oldSectorName]?.find(e => e.id === employeeId);
                            contextName = `Pneus / ${shift.name} / ${oldSectorName}`;
                        } else {
                            employee = factories[factoryId]?.sectors?.[oldSectorName]?.find(e => e.id === employeeId);
                            contextName = `${factories[factoryId].name} / ${oldSectorName}`;
                        }

            function handleReactivateEmployee() {
                const employeeId = document.getElementById('edit-employee-id').value, factoryId = document.getElementById('edit-employee-factory-id').value, contextId = document.getElementById('edit-employee-context-id').value, oldSectorName = document.getElementById('edit-employee-old-sector').value;
                let contextName = '', employee;

                if (factoryId === 'pneus') {

                    employee = shift?.functions?.[oldSectorName]?.find(e => e.id === employeeId);
                    contextName = `Pneus / ${shift.name} / ${oldSectorName}`;
                } else {
                    employee = factories[factoryId]?.sectors?.[oldSectorName]?.find(e => e.id === employeeId);
                    contextName = `${factories[factoryId].name} / ${oldSectorName}`;
                }

                if (employee) {

                    log.unshift({ id: `log-${Date.now()}`, type: 'ENTRADA', date: new Date().toLocaleDateString('pt-BR'), employeeName: employee.name, context: `Reativado em ${contextName}` });

                    hiringNeeds = hiringNeeds.filter(need => !(need.reasonType === 'Desligamento de Funcionário' && need.employeeToReplace?.toUpperCase() === employee.name.toUpperCase() && need.factoryId === factoryId && need.sector === oldSectorName));
                    hideModal();
                    saveData();
                    showMessage(`${employee.name} foi reativado com sucesso.`, "success");
                } else { showMessage("Erro ao encontrar funcionário para reativar.", "error"); }

                    <li><button data-action="show-movement-report" class="w-full text-left py-2 px-4 rounded-md transition ${currentView === 'movementReportView' ? 'bg-indigo-600 font-bold' : 'bg-indigo-500 hover:bg-indigo-600'}">Relatório de Movimentações</button></li>

            function renderSearchBar() {
                if (currentView !== 'organograma') return '';

                const factory = factories[currentFactoryId];

                return `
                    <div class="w-full max-w-7xl mx-auto mb-6 no-print">
                        <div class="flex items-center bg-white rounded-xl shadow-md p-4 space-x-3">
                            <i class="fas fa-search text-gray-400"></i>
                            <input type="text" id="employee-search-input" placeholder="Pesquisar funcionário por nome ou setor em ${factory ? factory.name : 'fábrica atual'}..."
                                class="flex-grow p-1 text-gray-700 focus:outline-none"
                                value="${searchTerm}"
                                oninput="App.handleSearch(this.value)">
                            ${searchTerm ? `<button onclick="App.handleSearch('')" class="text-gray-500 hover:text-gray-800"><i class="fas fa-times-circle"></i></button>` : ''}
                        </div>
                    </div>
                `;
            }

            function renderMainContent() {
                mainContentArea.innerHTML = '';

                // Adiciona barra de pesquisa se a vista atual for um organograma
                const searchBarHtml = renderSearchBar();
                if (searchBarHtml) {
                    mainContentArea.innerHTML += searchBarHtml;
                }

                const contentContainer = document.createElement('div');
                contentContainer.className = 'w-full max-w-7xl mx-auto';

                if (currentView === 'hiringNeedsOverview') contentContainer.innerHTML = renderHiringNeedsOverview();
                else if (currentView === 'logView') contentContainer.innerHTML = renderLogView();
                else if (currentView === 'movementReportView') contentContainer.innerHTML = renderMovementReport(); // NOVA VISTA
                else if (currentFactoryId === 'pneus') {
                    if (currentView === 'detailedShift') contentContainer.innerHTML = renderDetailedShiftView();

                        contentContainer.innerHTML = `<div class="bg-white rounded-xl shadow-2xl p-6 sm:p-8 lg:p-10 mx-auto"><div class="sub-nav-tabs mb-8 no-print"><button data-action="set-subview" data-subview="overview" class="sub-nav-btn ${currentOrgSubView === 'overview' ? 'active' : ''}">Resumo</button><button data-action="set-subview" data-subview="fullchart" class="sub-nav-btn ${currentOrgSubView === 'fullchart' ? 'active' : ''}">Organograma</button></div><div id="organograma-sub-content"></div></div>`;
                        const subContentContainer = contentContainer.querySelector('#organograma-sub-content');
                        if (currentOrgSubView === 'overview') renderAllShiftsOverview(subContentContainer);
                        if (currentOrgSubView === 'fullchart') renderFullOrgChart(subContentContainer);
                    }
                } else if (factories[currentFactoryId]) {
                    contentContainer.innerHTML = `<div class="bg-white rounded-xl shadow-2xl p-6 sm:p-8 lg:p-10 mx-auto"><div class="sub-nav-tabs mb-8 no-print"><button data-action="set-subview" data-subview="overview" class="sub-nav-btn ${currentOrgSubView === 'overview' ? 'active' : ''}">Resumo</button><button data-action="set-subview" data-subview="fullchart" class="sub-nav-btn ${currentOrgSubView === 'fullchart' ? 'active' : ''}">Organograma</button></div><div id="organograma-sub-content"></div></div>`;
                    const subContentContainer = contentContainer.querySelector('#organograma-sub-content');
                    if (currentOrgSubView === 'overview') renderFactoryOverview(subContentContainer, currentFactoryId);
                    if (currentOrgSubView === 'fullchart') renderFactoryFullChart(subContentContainer, currentFactoryId);
                } else {
                    contentContainer.innerHTML = `<div class="w-full max-w-xl mx-auto bg-white rounded-xl shadow-2xl p-8 text-center"><p class="text-xl text-gray-600">Selecione uma opção no menu.</p></div>`;
                }

                mainContentArea.appendChild(contentContainer);
            }

            // --- Lógica de Eventos ---
            function handleSearch(term) {
                searchTerm = term;
                updateUI();

                if (searchTerm) {
                    mainContentArea.scrollTop = 0;
                }
            }

            function handleNavClick(e) {
                const target = e.target.closest('button');
                if (!target) return;
                const { action, factory } = target.dataset;
                if (factory) {
                    currentFactoryId = factory;
                    currentView = 'organograma';
                    currentOrgSubView = 'overview';
                    selectedShiftId = null;
                } else if (action === 'show-hiring-needs') currentView = 'hiringNeedsOverview';
                else if (action === 'show-log') currentView = 'logView';
                else if (action === 'show-movement-report') currentView = 'movementReportView'; // Novo

                searchTerm = '';
                updateUI();
            }

            function handleMainContentClick(e) {
                const target = e.target.closest('button, .employee-card');
                if (!target) return;
                const { action, subview, shiftId, factoryId, contextId, sectorName, employeeId, needId } = target.dataset;
                if (action === 'set-subview') {
                    currentOrgSubView = subview;
                    updateUI();
                } else if (action === 'view-shift-details') {
                    selectedShiftId = shiftId;
                    currentView = 'detailedShift';
                    updateUI();
                } else if (action === 'print-page') window.print();
                else if (isAdminLoggedIn && target.classList.contains('employee-card')) handleEditEmployee(factoryId, contextId, sectorName, employeeId);
                else if (isAdminLoggedIn && action === 'add-hiring-need') handleAddHiringNeed();
                else if (isAdminLoggedIn && action === 'resolve-hiring-need') handleResolveHiringNeed(needId);
                else if (isAdminLoggedIn && action === 'add-employee') {
                    handleAddEmployee(factoryId, contextId);
                }
            }

            function handleModalEvents(e) {
                const target = e.target.closest('button, select');
                if (!target) return;
                const { action, factoryId, contextId } = target.dataset;
                if (action === 'save-new-employee') saveNewEmployee(factoryId, contextId);
                else if (action === 'save-edited-employee') saveEditedEmployee();
                else if (action === 'terminate-employee') handleTerminateEmployee();
                else if (action === 'reactivate-employee') handleReactivateEmployee();
                else if (action === 'save-new-hiring-need') handleSaveNewHiringNeed();
                else if (target.id === 'hiring-need-factory' || target.id === 'hiring-need-reasonType') {
                    // Chama a função de atualização de campos dinâmicos no modal de contratação
                    if (document.getElementById('hiring-need-factory')) {
                        const factoryId = document.getElementById('hiring-need-factory').value;
                        const factory = factories[factoryId];
                        const shiftContainer = document.getElementById('shift-selector-container');
                        const sectorSelect = document.getElementById('hiring-need-sector');
                        const reasonTypeSelect = document.getElementById('hiring-need-reasonType');

                        // Atualiza Setores
                        const sectors = getSectorsForFactory(factoryId);
                        const sectorOptions = sectors.map(s => `<option value="${s}">${s}</option>`).join('');
                        sectorSelect.innerHTML = '<option value="">Selecione</option>' + sectorOptions;

                        // Atualiza Turnos (apenas para pneus)
                        if (factory?.shifts) {
                            shiftContainer.classList.remove('hidden');
                            shiftContainer.innerHTML = `<label class="block text-sm font-medium text-gray-700">Turno</label><select id="hiring-need-shift" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3"><option value="">Todos</option>${factory.shifts.map(s => `<option value="${s.id}">${s.name}</option>`).join('')}</select>`;
                        } else {
                            shiftContainer.classList.add('hidden');
                            shiftContainer.innerHTML = '';
                        }

                        // Alterna campos de substituição
                        document.getElementById('replacement-fields').classList.toggle('hidden', reasonTypeSelect.value !== 'Desligamento de Funcionário');
                    }
                }
            }

            function updateUI() {
                if (!isAppReady) return;
                renderNavigation();
                renderMainContent();
            }

            // Update the main initialization function
            async function initializeAppData() {
                
                // 1. Tenta carregar dados locais se o Firebase falhou na inicialização (isFirebaseActive = false)
                if (!isFirebaseActive || !CANVAS_AUTH_TOKEN) {
                    if (loadDataFromLocal()) {
                        syncStatus.textContent = 'Modo Local Ativado';
                        syncStatus.style.backgroundColor = '#E74C3C';
                        isAppReady = true;
                        updateUI();
                        return;
                    }
                }

                // 2. Tenta Autenticar no Firebase (somente se isFirebaseActive for true)
                if (!isFirebaseActive) {
                    // Se não for possível inicializar o Firebase e não houver dados locais, carrega os dados iniciais
                    factories = JSON.parse(JSON.stringify(initialFactoriesData));
                    hiringNeeds = JSON.parse(JSON.stringify(initialHiringNeedsData));
                    log = JSON.parse(JSON.stringify(initialLogData));
                    syncStatus.textContent = 'Erro Fatal: Carregado Padrão';
                    isAppReady = true;
                    updateUI();
                    return;
                }
                
                try {
                    let user;
                    if (CANVAS_AUTH_TOKEN) {
                        // Autenticação Específica Gemini
                        user = await signInWithCustomToken(auth, CANVAS_AUTH_TOKEN);
                    } else {
                        // Autenticação Padrão para ambiente externo (login anônimo)
                        user = await signInAnonymously(auth);
                    }
                    const userId = user.user.uid;
                    console.log(`Firebase user logged in: ${userId}`);

                    // 🚨 NOVO: Define o caminho do Firestore para o espaço privado do usuário/artefato.
                    // Formato: artifacts/{appId}/users/{userId}/collection/doc
                    const docPath = `artifacts/${EXPLICIT_ARTIFACT_ID}/users/${userId}/${FIREBASE_COLLECTION}/${FIREBASE_DOC_ID}`;
                    ORG_DATA_REF = doc(db, docPath);
                    console.log("Firestore Path FINAL:", docPath);
                    
                    // 3. Setup real-time listener (This handles loading and setting isAppReady)
                    setupRealtimeListener();

                } catch (error) {
                    console.error("Erro de autenticação Firebase:", error);
                    isFirebaseActive = false;
                    
                    if (loadDataFromLocal()) {
                        syncStatus.textContent = 'Falha Auth: Modo Local';
                        syncStatus.style.backgroundColor = '#E74C3C';
                        isAppReady = true;
                        updateUI();
                    } else {
                        // Se falhar a autenticação E não houver dados locais, carrega iniciais
                        factories = JSON.parse(JSON.stringify(initialFactoriesData));
                        hiringNeeds = JSON.parse(JSON.stringify(initialHiringNeedsData));
                        log = JSON.parse(JSON.stringify(initialLogData));
                        syncStatus.textContent = 'Falha Auth: Carregado Padrão';
                        syncStatus.style.backgroundColor = '#E74C3C';
                        isAppReady = true;
                        updateUI();
                    }
                }
            }

            /**
             * Inicializa o documento no Firestore com dados iniciais se não existir.
             */
            async function initializeFirstTimeData() {
                // Tenta carregar localmente primeiro
                if (loadDataFromLocal()) {
                    isAppReady = true;
                    updateUI();
                    return; // Sai se carregou do local
                }

                // Se não houver dados locais, usa dados iniciais e tenta salvar (Firebase ou Local)
                console.log("No local data found. Initializing with default data...");
                factories = JSON.parse(JSON.stringify(initialFactoriesData));
                hiringNeeds = JSON.parse(JSON.stringify(initialHiringNeedsData));
                log = JSON.parse(JSON.stringify(initialLogData));

                // Tenta salvar pela primeira vez (o que irá para o Firebase ou Local)
                await saveData(true); // Salva silenciosamente

                if (!isAppReady) {
                    isAppReady = true;
                    updateUI();
                }
                showMessage('Dados iniciais carregados.', 'success');
            }


            /**
             * NOVO RELATÓRIO: Agrega entradas e saídas por fábrica e setor.
             */
            function renderMovementReport() {
                const reportData = {};
            
                // 1. Aggregate log data by Factory/Context
                log.forEach(entry => {
                    // Usa a primeira parte do contexto como chave (ex: Organograma B-Aro)
                    const [factoryName] = entry.context.split(' / ');
                    const key = factoryName; 
                    if (!reportData[key]) {
                        reportData[key] = [];
                    }
                    reportData[key].push(entry);
                });
            
                let content = '';
                const sortedReportKeys = Object.keys(reportData).sort();

                if (sortedReportKeys.length === 0) {
                    return `<div class="w-full max-w-4xl bg-white rounded-xl shadow-2xl p-6 sm:p-8 lg:p-10 mx-auto">
                        <h2 class="text-3xl font-bold text-gray-800 mb-8 text-center">Relatório Automático de Movimentações</h2>
                        <p class="text-center text-gray-500 text-lg mt-10">Nenhum registro de movimentação encontrado.</p>
                    </div>`;
                }

                // 2. Render report per Factory
                sortedReportKeys.forEach(factoryName => {
                    const entries = reportData[factoryName];
                    const totalEntries = entries.filter(e => e.type === 'ENTRADA').length;
                    const totalExits = entries.filter(e => e.type === 'SAÍDA').length;
                    const totalChanges = entries.filter(e => e.type === 'ALTERAÇÃO').length;
                    
                    // Group entries by Sector/Context for sub-lists
                    const sectorMovements = entries.reduce((acc, entry) => {
                        const contextParts = entry.context.split(' / ');
                        // Sector is typically the last or second to last part (handling 'Pneus / TURNO / SETOR')
                        let sectorName = contextParts[contextParts.length - 1]; 
                        if (contextParts.length >= 3 && factoryName === 'Organograma Pneus') {
                             // Exibe SETOR / TURNO
                            sectorName = `${contextParts[2]} / ${contextParts[1]}`;
                        }
                        
                        if (!acc[sectorName]) {
                            acc[sectorName] = [];
                        }
                        acc[sectorName].push(entry);
                        return acc;
                    }, {});
                    
                    const sortedSectorKeys = Object.keys(sectorMovements).sort();

                    let sectorsHtml = sortedSectorKeys.map(sector => {
                        const moves = sectorMovements[sector];
                        const entradas = moves.filter(m => m.type === 'ENTRADA').length;
                        const saidas = moves.filter(m => m.type === 'SAÍDA').length;
                        const alteracoes = moves.filter(m => m.type === 'ALTERAÇÃO').length;
            
                        if (entradas === 0 && saidas === 0 && alteracoes === 0) return '';
                        
                        const listItems = moves.map(m => {
                            const colorClass = m.type === 'ENTRADA' ? 'text-green-700' : m.type === 'SAÍDA' ? 'text-red-700' : 'text-blue-700';
                            let employeeDisplay = m.employeeName;
                            // Exibir o motivo se for uma alteração (Ex: Nome para DENNER MELLO)
                            if (m.type === 'ALTERAÇÃO' || m.context.includes('(Transferido') || m.context.includes('(Substituição')) {
                                employeeDisplay = m.context.replace(`${factoryName} / `, '').replace(`${sector} (`, ' (');
                            }

                            return `<li class="ml-4 flex justify-between items-center text-sm ${colorClass}">
                                        <span class="font-medium">${m.type === 'ALTERAÇÃO' ? employeeDisplay : `${m.employeeName} (${m.type})`}</span>
                                        <span class="text-xs text-gray-500 ml-2">${m.date}</span>
                                    </li>`;
                        }).join('');
                        
                        return `<div class="bg-gray-50 p-4 rounded-lg border border-gray-200 mb-4 break-inside-avoid">
                                    <h4 class="font-semibold text-lg text-gray-800 border-b pb-2 mb-2">${sector}</h4>
                                    <p class="text-xs text-gray-600 mb-2">Entradas: ${entradas} | Saídas: ${saidas} | Alterações: ${alteracoes}</p>
                                    <ul class="list-none p-0">${listItems}</ul>
                                </div>`;
                    }).join('');
            
                    content += `<div class="bg-white p-6 rounded-xl shadow-lg mb-8 printable-area">
                        <h3 class="text-2xl font-bold text-gray-800 mb-4">${factoryName}</h3>
                        <p class="text-lg font-semibold text-gray-600 mb-6">Total de Movimentações: Entradas (${totalEntries}) / Saídas (${totalExits}) / Outras (${totalChanges})</p>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">${sectorsHtml}</div>
                    </div>`;
                });
            
                const header = `<div class="w-full max-w-6xl mx-auto"><h2 class="text-4xl font-extrabold text-gray-800 mb-2 text-center">Relatório Automático de Movimentações</h2><p class="text-center text-gray-600 mb-8">Análise de Entradas e Saídas por Setor, baseada no histórico da aplicação.</p><button data-action="print-page" class="mb-4 bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-md transition no-print">Imprimir Relatório</button></div>`;
                
                return header + content;
            }


            // --- IMPLEMENTAÇÃO DAS FUNÇÕES DE RENDERIZAÇÃO COMPLETAS ---
            function renderAllShiftsOverview(container) {
                if (!factories.pneus || !factories.pneus.shifts) { container.innerHTML = '<p>Carregando...</p>'; return; }
                const shifts = factories.pneus.shifts;

                // Filtra os turnos cujos funcionários ativos satisfaçam o termo de pesquisa (se houver)
                const filteredShifts = shifts.filter(shift => {
                    if (!searchTerm) return true;
                    const shiftEmployees = getAllEmployeesFromShift(shift);
                    return filterEmployees(shiftEmployees).length > 0;
                });

                const content = filteredShifts.length > 0 ? `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">${filteredShifts.map(shift => {
                    const needsForShift = hiringNeeds.filter(need => need.factoryId === 'pneus' && (need.shiftId === shift.id || !need.shiftId));
                    let hiringNeedsHtml = needsForShift.length > 0 ? `<div class="mt-4 pt-3 border-t border-blue-200"><h4 class="font-bold text-red-600 text-sm mb-1">VAGA EM ABERTO:</h4><ul class="list-disc list-inside text-sm text-red-800">${needsForShift.map(need => `<li>${need.sector}</li>`).join('')}</ul></div>` : '';

                    // Contagem filtrada
                    const shiftEmployees = getAllEmployeesFromShift(shift);
                    const filteredAndActiveCount = filterEmployees(shiftEmployees.filter(emp => emp.status === 'active')).length;

                    if (searchTerm && filteredAndActiveCount === 0) return ''; // Não mostra o cartão se não houver resultados ativos na pesquisa

                    return `<div class="bg-white rounded-lg shadow-md p-6 border-l-4 border-blue-500"><h3 class="text-xl font-bold text-blue-800 mb-2">${shift.name}</h3><p class="text-gray-700"><span class="font-semibold">Responsável:</span> ${shift.responsible}</p><p class="text-gray-700"><span class="font-semibold">Horário:</span> ${shift.time}</p><p class="text-gray-700 mt-2"><span class="font-semibold">Funcionários Ativos:</span> ${filteredAndActiveCount}</p>${hiringNeedsHtml}<button data-action="view-shift-details" data-shift-id="${shift.id}" class="mt-4 bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-md transition">Ver Detalhes</button></div>`
                }).join('')}</div>` : `<p class="text-center text-gray-500 text-lg">${searchTerm ? 'Nenhum funcionário encontrado com este termo.' : 'Nenhum turno cadastrado.'}</p>`;

                container.innerHTML = `<div class="printable-area"><div class="flex justify-between items-center mb-4 no-print"><h2 class="text-3xl font-bold text-gray-800">Resumo de Todos os Turnos</h2><button data-action="print-page" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-md transition">Imprimir</button></div><div class="print-header hidden"><svg viewBox="0 0 200 50" class="print-logo" fill="black"><text x="10" y="40" font-family="Inter, sans-serif" font-size="35" font-weight="bold">FABRECK</text></svg><h2 class="print-title">FABRECK PNEUS - RESUMO DE TURNOS</h2></div>${content}</div>`;
            }

            function renderFullOrgChart(container) {
                if (!factories.pneus || !factories.pneus.shifts) { container.innerHTML = '<p>Carregando...</p>'; return; }
                const shifts = factories.pneus.shifts;

                const orgChartContent = shifts.length > 0 ? `<div class="flex flex-col items-center"><div class="w-full flex flex-col lg:flex-row justify-around items-start gap-8 org-chart-columns">${shifts.map(shift => {

                    // Renderiza as funções/setores do turno
                    const sectorsHtml = Object.entries(shift.functions)
                        .sort((a, b) => a[0].localeCompare(b[0]))
                        .map(([func, employees]) => {
                            // Filtra funcionários para a pesquisa
                            let filteredEmployees = filterEmployees(employees);

                            // ORDENAÇÃO POR HIERARQUIA: 1º Responsável do Turno ou Líder Explícito, 2º Alfabética
                            const sortedEmployees = sortEmployeesByHierarchy(filteredEmployees, shift.responsible);

                            if (searchTerm && filteredEmployees.length === 0) return ''; // Oculta setor se vazio na pesquisa

                            return `<div class="sector-card"><h4>${func}</h4><div class="space-y-2">${sortedEmployees.map(emp => {
                                // Adicionada proteção dentro do map também, embora a ordenação já trate o caso
                                const empName = emp.name ? emp.name.toUpperCase().trim() : '';
                                const isLeader = (shift.responsible?.toUpperCase().trim() === empName) || PRIORITY_LEADERS.map(n => n.toUpperCase()).includes(empName);
                                const leaderClass = isLeader ? 'leader-priority' : '';
                                return `<div class="employee-card bg-gray-50 rounded shadow-sm p-2 text-center text-sm ${isAdminLoggedIn ? 'cursor-pointer' : ''} ${emp.status === 'terminated' ? 'terminated' : ''} ${leaderClass}" data-factory-id="pneus" data-context-id="${shift.id}" data-sector-name="${func}" data-employee-id="${emp.id}">${emp.name}</div>`;

                    if (!searchTerm || sectorsHtml.trim().length > 0) {
                        return `<div class="flex flex-col items-center w-full lg:w-1/3 org-chart-column"><div class="bg-blue-800 text-white rounded-lg p-4 shadow-lg text-center w-full max-w-sm mb-4 shift-header"><h3>${shift.name}</h3><p>Responsável: ${shift.responsible}</p></div><div class="w-full space-y-4">${sectorsHtml}</div></div>`;
                    }
                    return ''; // Oculta o turno se não houver resultados na pesquisa
                }).join('')}</div></div>` : `<p class="text-center text-gray-500 text-lg">Nenhum turno cadastrado.</p>`;

                container.innerHTML = `<div class="printable-area"><div class="flex justify-between items-center mb-4 no-print"><h2 class="text-3xl font-bold text-gray-800">Organograma Estruturado</h2><button data-action="print-page" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-md transition">Imprimir</button></div><div class="print-header hidden"><svg viewBox="0 0 200 50" class="print-logo" fill="black"><text x="10" y="40" font-family="Inter, sans-serif" font-size="35" font-weight="bold">FABRECK</text></svg><h2 class="print-title">FABRECK PNEUS</h2></div><div class="w-full overflow-x-auto p-4 org-chart-container">${orgChartContent}</div></div>`;
            }

            function renderDetailedShiftView() {

                    ? `<button data-action="add-employee" data-factory-id="pneus" data-context-id="${shift.id}" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-md transition">Adicionar Funcionário</button>`
                    : '';

                const needsForShift = hiringNeeds.filter(need => need.factoryId === 'pneus' && (need.shiftId === shift.id || !need.shiftId));
                let hiringNeedsHtml = needsForShift.length > 0 ? `<div class="mb-8 p-4 bg-red-50 border-l-4 border-red-500 rounded-r-lg"><h4 class="font-bold text-red-700 text-lg mb-2">Vagas em Aberto:</h4><ul class="list-disc list-inside text-red-800">${needsForShift.map(need => `<li><strong>${need.sector}:</strong> ${need.reasonType}</li>`).join('')}</ul></div>` : '';

                    .sort((a, b) => a[0].localeCompare(b[0]))
                    .map(([func, employees]) => {
                        let filteredEmployees = filterEmployees(employees);
                        const responsibleName = shift.responsible?.toUpperCase().trim();

                        // ORDENAÇÃO POR HIERARQUIA: 1º Responsável do Turno ou Líder Explícito, 2º Alfabética
                        const sortedEmployees = sortEmployeesByHierarchy(filteredEmployees, responsibleName);

                        if (searchTerm && filteredEmployees.length === 0) return ''; // Oculta setor se vazio na pesquisa

                        return `<div class="sector-card"><h4>${func}</h4><div class="space-y-2">${sortedEmployees.map(emp => {
                            const empName = emp.name ? emp.name.toUpperCase().trim() : '';
                            const isLeader = (responsibleName === empName) || PRIORITY_LEADERS.map(n => n.toUpperCase()).includes(empName);
                            const leaderClass = isLeader ? 'leader-priority' : '';
                            return `<div class="employee-card bg-gray-50 rounded shadow-sm p-3 text-center ${isAdminLoggedIn ? 'cursor-pointer' : ''} ${emp.status === 'terminated' ? 'terminated' : ''} ${leaderClass}" data-factory-id="pneus" data-context-id="${shift.id}" data-sector-name="${func}" data-employee-id="${emp.id}">${emp.name}</div>`;
                        }).join('')}</div></div>`;
                    }).join('')}</div>` : `<p class="text-center text-gray-500 text-lg">${searchTerm ? 'Nenhum funcionário encontrado com este termo.' : 'Nenhum funcionário neste turno.'}</p>`;

                return `<div class="w-full max-w-6xl bg-white rounded-xl shadow-2xl p-6 sm:p-8 lg:p-10 mx-auto printable-area"><div class="flex flex-wrap justify-between items-center gap-4 mb-4 no-print"><h2 class="text-3xl font-bold text-gray-800">Detalhes do Turno</h2><div class="flex items-center gap-2">${adminAddButton}<button data-action="print-page" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-md transition">Imprimir</button></div></div><div class="print-header hidden"><svg viewBox="0 0 200 50" class="print-logo" fill="black"><text x="10" y="40" font-family="Inter, sans-serif" font-size="35" font-weight="bold">FABRECK</text></svg><h2 class="print-title">FABRECK PNEUS - ${shift.name}</h2></div><div class="bg-blue-100 rounded-lg p-5 mb-8 shadow-md text-center"><h2 class="text-3xl font-bold text-blue-900 mb-2">${shift.name}</h2><p class="text-blue-800 text-lg"><span class="font-semibold">Responsável:</span> ${shift.responsible}</p><p class="text-blue-800 text-lg"><span class="font-semibold">Horário:</span> ${shift.time}</p></div>${hiringNeedsHtml}<h3 class="text-2xl font-bold text-gray-800 mb-6 text-center border-b pb-3">Funcionários por Setor</h3>${functionsHtml}</div>`;
            }

            function renderFactoryOverview(container, factoryId) {
                const factory = factories[factoryId];
                if (!factory) { container.innerHTML = '<p>Carregando...</p>'; return; }
                const adminAddButton = isAdminLoggedIn ? `<button data-action="add-employee" data-factory-id="${factoryId}" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-md transition">Adicionar Funcionário</button>` : '';

                const allEmployees = getAllEmployeesFromFactory(factory);
                const activeEmployeesCount = getActiveEmployees(allEmployees).length;

                const content = Object.keys(factory.sectors).length > 0 ? `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">${Object.entries(factory.sectors)
                    .sort((a, b) => a[0].localeCompare(b[0]))
                    .map(([sectorName, employees]) => {

                        const filteredEmployees = filterEmployees(employees);

                        if (searchTerm && filteredEmployees.length === 0) return '';

                        const needsForSector = hiringNeeds.filter(need => need.factoryId === factoryId && need.sector === sectorName);
                        let hiringNeedsHtml = needsForSector.length > 0 ? `<div class="mt-4 pt-3 border-t border-blue-200"><h4 class="font-bold text-red-600 text-sm mb-1">VAGA EM ABERTO:</h4><ul class="list-disc list-inside text-sm text-red-800">${needsForSector.map(need => `<li>${need.reasonType === 'Nova Posição' ? 'Nova Posição' : 'Substituição'}</li>`).join('')}</ul></div>` : '';

                        const activeSectorEmployees = getActiveEmployees(filteredEmployees).length;

                        return `<div class="bg-white rounded-lg shadow-md p-6 border-l-4 border-blue-500"><h3 class="text-xl font-bold text-blue-800 mb-2">${sectorName}</h3><p class="text-gray-700 mt-2"><span class="font-semibold">Funcionários Ativos:</span> ${activeSectorEmployees}</p>${hiringNeedsHtml}</div>`
                    }).join('')}</div>` : `<p class="text-center text-gray-500 text-lg">${searchTerm ? 'Nenhum funcionário encontrado com este termo.' : 'Nenhum setor cadastrado.'}</p>`;

                container.innerHTML = `<div class="printable-area"><div class="flex flex-wrap justify-between items-center gap-4 mb-4 no-print"><h2 class="text-3xl font-bold text-gray-800">Resumo de Setores ${factory.name}</h2><div class="flex items-center gap-2">${adminAddButton}<button data-action="print-page" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-md transition">Imprimir</button></div></div><div class="print-header hidden"><svg viewBox="0 0 200 50" class="print-logo" fill="black"><text x="10" y="40" font-family="Inter, sans-serif" font-size="35" font-weight="bold">FABRECK</text></svg><h2 class="print-title">${factory.name.toUpperCase().replace('ORGANOGRAMA', 'FABRECK')} - RESUMO</h2></div><div class="text-center mb-8"><p class="text-xl text-gray-600">Total de Funcionários Ativos: ${activeEmployeesCount}</p></div>${content}</div>`;
            }

            function renderFactoryFullChart(container, factoryId) {
                const factory = factories[factoryId];
                if (!factory) { container.innerHTML = '<p>Carregando...</p>'; return; }
                const adminAddButton = isAdminLoggedIn ? `<button data-action="add-employee" data-factory-id="${factoryId}" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-md transition">Adicionar Funcionário</button>` : '';

                const allEmployees = getAllEmployeesFromFactory(factory);
                const activeEmployeesCount = getActiveEmployees(allEmployees).length;

                const topSectorsOrder = ["LÍDER DE PRODUÇÃO", "SUPORTE E ORGANIZAÇÃO", "ORGANIZAÇÃO E QUALIDADE"];
                const allSectorEntries = Object.entries(factory.sectors);

                // Filtra e ordena setores de topo
                const topSectorEntries = allSectorEntries.filter(([sectorName]) => topSectorsOrder.includes(sectorName.toUpperCase()))
                    .map(([name, emps]) => [name, filterEmployees(emps)]) // Filtra funcionários
                    .filter(([_, emps]) => emps.length > 0 || !searchTerm) // Oculta se vazio na pesquisa
                    .sort((a, b) => topSectorsOrder.indexOf(a[0].toUpperCase()) - topSectorsOrder.indexOf(b[0].toUpperCase()));

                // Filtra e ordena outros setores
                const otherSectorEntries = allSectorEntries.filter(([sectorName]) => !topSectorsOrder.includes(sectorName.toUpperCase()))
                    .map(([name, emps]) => [name, filterEmployees(emps)]) // Filtra funcionários
                    .filter(([_, emps]) => emps.length > 0 || !searchTerm) // Oculta se vazio na pesquisa
                    .sort((a, b) => a[0].localeCompare(b[0]));

                const renderSector = (sectorName, employees, isLeaderSector = false) => {
                    // ORDENAÇÃO POR HIERARQUIA: 1º Líderes Explicitamente Nomeados, 2º Pelo array PRIORITY_LEADERS, 3º Alfabética
                    const sortedEmployees = sortEmployeesByHierarchy(employees);

                    return `<div class="sector-card ${isLeaderSector ? 'leader' : ''}"><h4>${sectorName}</h4><div class="space-y-2">${sortedEmployees.map(emp => {
                        const empName = emp.name ? emp.name.toUpperCase().trim() : '';
                        const isLeader = PRIORITY_LEADERS.map(n => n.toUpperCase()).includes(empName);
                        const leaderClass = isLeader ? 'leader-priority' : '';
                        return `<div class="employee-card bg-gray-50 rounded shadow-sm p-3 text-center ${isAdminLoggedIn ? 'cursor-pointer' : ''} ${emp.status === 'terminated' ? 'terminated' : ''} ${leaderClass}" data-factory-id="${factoryId}" data-context-id="" data-sector-name="${sectorName}" data-employee-id="${emp.id}">${emp.name}</div>`;
                    }).join('')}</div></div>`;
                };

                const topSectorsHtml = topSectorEntries.length > 0 ? `<div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-8">${topSectorEntries.map(([name, emps]) => renderSector(name, emps, true)).join('')}</div><hr class="my-8"/>` : '';

                const otherSectorsHtml = otherSectorEntries.length > 0 ? `<h3 class="text-2xl font-bold text-gray-700 mb-6 text-center">Setores de Produção</h3><div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">${otherSectorEntries.map(([name, emps]) => renderSector(name, emps)).join('')}</div>` : '';

                const content = (topSectorsHtml.length + otherSectorsHtml.length) === 0 && searchTerm.length > 0 ?
                    `<p class="text-center text-gray-500 text-lg">Nenhum funcionário ou setor encontrado com este termo.</p>` :
                    `${topSectorsHtml}${otherSectorsHtml}`;

                container.innerHTML = `<div class="printable-area"><div class="flex flex-wrap justify-between items-center gap-4 mb-4 no-print"><h2 class="text-3xl font-bold text-gray-800">Organograma Estruturado</h2><div class="flex items-center gap-2">${adminAddButton}<button data-action="print-page" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-md transition">Imprimir</button></div></div><div class="w-full max-w-6xl mx-auto"><div class="text-center mb-8 print-header hidden"><svg viewBox="0 0 200 50" class="print-logo" fill="black"><text x="10" y="40" font-family="Inter, sans-serif" font-size="35" font-weight="bold">FABRECK</text></svg><h2 class="print-title">${factory.name.toUpperCase().replace('ORGANOGRAMA', 'FABRECK')}</h2></div><div class="text-center mb-8 no-print"><p class="text-xl text-gray-600">Total de Funcionários Ativos: ${activeEmployeesCount}</p></div>${content}</div></div>`;
            }


            function renderHiringNeedsOverview() {
                const resolveButton = (needId) => isAdminLoggedIn
                    ? `<button data-action="resolve-hiring-need" data-need-id="${needId}" class="ml-4 px-3 py-1 bg-red-500 hover:bg-red-600 text-white text-xs font-semibold rounded-md transition">Resolver Vaga</button>`
                    : '';

                const content = hiringNeeds.length > 0 ? `<div class="space-y-6">${hiringNeeds.map(need => {
                    const factory = factories[need.factoryId];
                    let contextLine = `<p class="text-sm text-gray-600">Fábrica: ${factory ? factory.name : 'N/A'}</p>`;
                    if (need.shiftId && factory?.shifts) {
                        const shift = factory.shifts.find(s => s.id === need.shiftId);
                        contextLine += `<p class="text-sm text-gray-600">Turno: ${shift ? shift.name : 'N/A'}</p>`;
                    }
                    return `<div class="bg-yellow-50 border-l-4 border-yellow-500 rounded-r-lg p-4 shadow-md text-left">
                                <div class="flex justify-between items-start">
                                    <div>
                                        <h3 class="text-xl font-bold text-yellow-800">${need.sector}</h3>
                                        ${contextLine}
                                    </div>
                                    <div class="text-right">
                                        <p class="font-semibold">${need.reasonType}</p>
                                        <p class="text-sm text-gray-600">Início: ${need.expectedStartDate || 'N/A'}</p>
                                    </div>
                                </div>
                                ${need.reasonType === 'Desligamento de Funcionário' ? `<p class="text-sm mt-2"><strong>Substituindo:</strong> ${need.employeeToReplace} (Desligamento em: ${need.departureDate || 'N/A'})</p>` : ''}
                                <div class="mt-4 pt-3 border-t">
                                    <p class="font-semibold">Responsabilidades:</p>
                                    <p class="text-sm text-gray-700 whitespace-pre-wrap">${need.keyResponsibilities || 'Não especificado'}</p>
                                </div>
                                ${need.notes ? `<div class="mt-2 pt-2 border-t"><p class="font-semibold">Observações:</p><p class="text-sm text-gray-700 whitespace-pre-wrap">${need.notes}</p></div>` : ''}
                                <div class="flex justify-end mt-4">
                                    ${resolveButton(need.id)}
                                </div>
                            </div>`
                }).join('')}</div>` : `<p class="text-center text-gray-500 text-lg">Nenhuma necessidade de contratação registrada.</p>`;

                return `<div class="w-full max-w-4xl bg-white rounded-xl shadow-2xl p-6 sm:p-8 lg:p-10 mx-auto"><div class="flex justify-between items-center mb-8"><h2 class="text-3xl font-bold text-gray-800">Necessidades de Contratação</h2><button data-action="add-hiring-need" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-md transition ${!isAdminLoggedIn ? 'hidden' : ''}">Adicionar Nova</button></div>${content}</div>`;
            }

            function renderLogView() {
                const sortedLog = [...log].sort((a, b) => {
                    const parseDate = (dateStr) => {
                        const parts = dateStr.split('/');
                        return parts.length === 3 ? new Date(`${parts[2]}-${parts[1]}-${parts[0]}`).getTime() : NaN;
                    };
                    const dateA = parseDate(a.date);
                    const dateB = parseDate(b.date);
                    if (isNaN(dateA) || isNaN(dateB)) return 0;
                    return dateB - dateA;
                });
                const content = sortedLog.length > 0 ? `<div class="overflow-x-auto"><table class="min-w-full bg-white rounded-lg shadow"><thead class="bg-gray-200"><tr><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Data</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Tipo</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Funcionário</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Local</th></tr></thead><tbody class="divide-y divide-gray-200">${sortedLog.map(entry => `<tr><td class="px-6 py-4 whitespace-nowrap">${entry.date}</td><td class="px-6 py-4 whitespace-nowrap"><span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${entry.type === 'ENTRADA' ? 'bg-green-100 text-green-800' : entry.type === 'SAÍDA' ? 'bg-red-100 text-red-800' : 'bg-blue-100 text-blue-800'}">${entry.type}</span></td><td class="px-6 py-4 whitespace-nowrap font-medium">${entry.employeeName}</td><td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${entry.context}</td></tr>`).join('')}</tbody></table></div>` : `<p class="text-center text-gray-500 text-lg">Nenhum registro de movimentação encontrado.</p>`;
                return `<div class="w-full max-w-4xl bg-white rounded-xl shadow-2xl p-6 sm:p-8 lg:p-10 mx-auto"><h2 class="text-3xl font-bold text-gray-800 mb-8 text-center">Log de Movimentações (Detalhado)</h2>${content}</div>`;
            }


            function init() {
                logoContainer.innerHTML = `<svg viewBox="0 0 200 50" class="w-full h-auto" fill="currentColor"><text x="10" y="40" font-family="Inter, sans-serif" font-size="35" font-weight="bold">FABRECK</text></svg>`;

                navigationContainer.addEventListener('click', handleNavClick);
                mainContentArea.addEventListener('click', handleMainContentClick);
                modalBody.addEventListener('click', handleModalEvents);
                modalBody.addEventListener('change', handleModalEvents);
                adminLoginBtn.addEventListener('click', loginAdmin);
                adminPasswordInput.addEventListener('keyup', (e) => e.key === 'Enter' && loginAdmin());
                adminLogoutBtn.addEventListener('click', logoutAdmin);

                modalCloseBtn.addEventListener('click', hideModal);
                document.getElementById('confirm-modal-close-btn').addEventListener('click', hideConfirmModal);
                document.getElementById('confirm-modal-cancel-btn').addEventListener('click', hideConfirmModal);
                confirmModalOkBtn.addEventListener('click', () => { if (confirmCallback) { confirmCallback(true); confirmCallback = null; } hideConfirmModal(); });

                // Acompanhamento do status de rede para feedback visual
                window.addEventListener('online', updateOnlineStatus);
                window.addEventListener('offline', updateOnlineStatus);

                initializeAppData();
            }

            // Funções públicas para interação com a barra de pesquisa
            return { init, handleSearch };
        })();

        // --- Fix para o ReferenceError: App is not defined ---
        window.App = App;

        // --- Start the application ---
        App.init();

    </script>
</body>

</html>
